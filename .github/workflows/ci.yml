name: DevSecOps CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  test:
    name: Unit Tests & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          $HOME/.local/bin/uv sync

      - name: Lint with ruff
        run: |
          $HOME/.local/bin/uv run ruff check .

      - name: Run unit tests
        run: |
          $HOME/.local/bin/uv run pytest -v

  security-scan:
    name: 4-Tier Security Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tier 1 - Gitleaks Secret Scan
        run: |
          docker run --rm -v "$PWD:/path" zricethezav/gitleaks:latest detect --source="/path" --verbose

      - name: Tier 2 - Semgrep SAST
        run: |
          python -m pip install semgrep
          semgrep scan --error --config p/security-audit --config p/owasp-top-ten --config p/python src/

      - name: Tier 3 - Trivy Dependency Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Container Image Build & Trivy Scan
        run: |
          docker build -t oakai/vuln-patch-analyst:test .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity CRITICAL,HIGH --exit-code 0 oakai/vuln-patch-analyst:test
