[project]
name = "vuln-patch-analyst"
version = "0.1.0"
description = "Autonomous Vulnerability Remediation & Safe Package Purge Micro-Agent (Oakai Security)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.3",
    "requests>=2.34.2",
]

[project.scripts]
vuln-patch-analyst = "vuln_patch_analyst.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.5",
]
